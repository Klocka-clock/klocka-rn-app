name: Expo CI

on:
  push:
    branches:
      - develop
      - staging
      - main

  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

      # CI chỉ kiểm tra source bằng cấu hình development.
      APP_VARIANT: development

      # Giá trị giả dành cho quá trình bundle CI.
      # Không kết nối tới backend thật.
      EXPO_PUBLIC_API_URL: https://example.invalid

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo dependencies
        run: npx --yes expo-doctor

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test --if-present

      - name: Verify Expo bundle
        run: npx expo export --platform all --output-dir dist
